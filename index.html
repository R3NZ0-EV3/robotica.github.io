
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robótica Educativa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #00d4ff;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            margin: 30px auto;
        }

        button {
            background: #00d4ff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00aacc;
        }
    </style>
</head>
<body>

    <h1>🤖 Robótica Educativa</h1>
    <p>¡Aprende, crea e innova con tecnología!</p>

    <div class="card">
        <h2>Construye el futuro</h2>
        <p>Descubre el mundo de la robótica, programación y STEM.</p>
        <button onclick="saludar()">¡Comenzar!</button>
    </div>

    <script>
        function saludar() {
            alert("¡Bienvenido al mundo de la robótica!");
        }
    </script>

</body>
</html>
